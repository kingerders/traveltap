<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="brandGradient" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#FF9A56"/>
            <stop offset="0.5" stop-color="#FF6B6B"/>
            <stop offset="1" stop-color="#C44569"/>
        </linearGradient>
         <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="15"/>
            <feOffset dx="0" dy="10" result="offsetblur"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.3"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- The T Shape -->
    <!-- Top Bar: A slightly dynamic curve symbolizing a horizon or flight path -->
    <path d="M162 256 C 162 211, 862 211, 862 256" 
          stroke="url(#brandGradient)" 
          stroke-width="120" 
          stroke-linecap="round"
          filter="url(#dropShadow)"/>

    <!-- Vertical Stem: A solid foundation -->
    <path d="M512 256 L512 818" 
          stroke="url(#brandGradient)" 
          stroke-width="120" 
          stroke-linecap="round"
          filter="url(#dropShadow)"/>

    <!-- The Plane -->
    <!-- Positioned at the end of the T's crossbar, suggesting taking off -->
    <g transform="translate(862, 256) rotate(-15)">
        <path d="M40 0 L-25 25 L-10 0 L-25 -25 Z" fill="#C44569" transform="scale(2.5)"/>
    </g>
</svg>
